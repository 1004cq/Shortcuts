services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mediavault_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-mediavault-dev-secret-change-in-production}
      MONGODB_URI: mongodb://mongo:27017/mediavault
      UPLOAD_DIR: /app/uploads
      APP_URL: ${APP_URL:-http://localhost:3000}
    volumes:
      - mediavault_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mediavault_mongo:
  mediavault_uploads:
