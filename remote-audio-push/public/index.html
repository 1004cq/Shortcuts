<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>管理员后台 · 远程音频</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b14;
        --card: rgba(255, 255, 255, 0.06);
        --line: rgba(255, 255, 255, 0.12);
        --text: #e8eefc;
        --muted: #94a3b8;
        --ok: #34d399;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: var(--text);
        background:
          radial-gradient(ellipse 80% 50% at 20% -10%, rgba(56, 189, 248, 0.22), transparent 55%),
          radial-gradient(ellipse 60% 40% at 90% 10%, rgba(248, 113, 113, 0.12), transparent 50%),
          var(--bg);
        padding: 24px;
      }
      .wrap { max-width: 640px; margin: 0 auto; }
      h1 { font-size: 1.45rem; margin: 0 0 6px; }
      .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; line-height: 1.45; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        backdrop-filter: blur(18px);
        margin-bottom: 14px;
      }
      label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
      input {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.35);
        color: var(--text);
        padding: 12px 14px;
        margin-bottom: 12px;
        outline: none;
      }
      input:focus { border-color: rgba(56, 189, 248, 0.7); }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        color: #041018;
      }
      button.secondary {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        border: 1px solid var(--line);
      }
      button.danger {
        background: linear-gradient(135deg, #f87171, #fb7185);
        color: #1f0508;
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
      .dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.15); }
      .log {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        max-height: 200px;
        overflow: auto;
        white-space: pre-wrap;
        color: #cbd5e1;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid rgba(248, 113, 113, 0.35);
        color: #fecaca;
        background: rgba(248, 113, 113, 0.12);
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="badge">ADMIN ONLY · 仅管理员可发送播放指令</div>
      <h1>远程音频 · 管理员后台</h1>
      <p class="sub">
        输入目标用户 ID 与音频 HTTPS 地址，点击播放即可推送到对方 iPhone（需对方已运行接收快捷指令并保持连接）。
      </p>

      <div class="card">
        <div class="status"><span class="dot" id="dot"></span><span id="connText">未连接</span></div>
        <label style="margin-top: 14px">管理员 Token（ADMIN_TOKEN）</label>
        <input id="token" type="password" placeholder="服务器 ADMIN_TOKEN / AUTH_TOKEN" autocomplete="off" />
        <div class="row">
          <button class="secondary" id="btnConnect" type="button">连接控制通道</button>
          <button class="secondary" id="btnRefresh" type="button">刷新在线用户</button>
        </div>
      </div>

      <div class="card">
        <label>目标用户 ID</label>
        <input id="userId" placeholder="例如 iphone_zhangsan（与接收端一致）" />
        <label>音频 URL（HTTPS，iPhone 可直接访问）</label>
        <input id="audioUrl" placeholder="https://example.com/a.mp3" />
        <label>标题（可选）</label>
        <input id="title" value="管理员推送" />
        <div class="row">
          <button id="btnPlay" type="button" disabled>▶ 立即播放到该用户</button>
          <button class="danger" id="btnStop" type="button" disabled>■ 停止</button>
        </div>
      </div>

      <div class="card">
        <label>在线 iPhone 接收端</label>
        <div id="online" class="log">连接后显示</div>
      </div>

      <div class="card">
        <label>延迟 / 事件日志</label>
        <div id="log" class="log"></div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let socket = null;

      function log(msg) {
        $("log").textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + $("log").textContent;
      }

      function setConnected(on) {
        $("dot").classList.toggle("on", on);
        $("connText").textContent = on ? "管理员通道已连接（WebSocket）" : "未连接";
        $("btnPlay").disabled = !on;
        $("btnStop").disabled = !on;
      }

      function save() {
        localStorage.setItem(
          "rap_admin",
          JSON.stringify({
            token: $("token").value,
            userId: $("userId").value,
            audioUrl: $("audioUrl").value,
            title: $("title").value,
          })
        );
      }

      function load() {
        try {
          const raw = JSON.parse(localStorage.getItem("rap_admin") || "{}");
          if (raw.token) $("token").value = raw.token;
          if (raw.userId) $("userId").value = raw.userId;
          if (raw.audioUrl) $("audioUrl").value = raw.audioUrl;
          if (raw.title) $("title").value = raw.title;
        } catch {}
      }

      function socketPath() {
        return location.pathname.includes("/realtime") ? "/realtime/socket.io" : "/socket.io";
      }

      async function refreshOnline() {
        const token = $("token").value.trim();
        if (!token) return;
        try {
          const res = await fetch(`./api/online?token=${encodeURIComponent(token)}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "failed");
          $("online").textContent = data.items?.length
            ? data.items
                .map(
                  (u) =>
                    `${u.userId} · ${u.deviceCount} 台在线\n` +
                    u.devices
                      .map((d) => `  - ${d.deviceId} · ${new Date(d.lastSeen).toLocaleTimeString()}`)
                      .join("\n")
                )
                .join("\n\n")
            : "当前无在线接收端（请先让用户运行快捷指令）";
        } catch (e) {
          $("online").textContent = String(e.message || e);
        }
      }

      function connect() {
        const token = $("token").value.trim();
        if (!token) {
          alert("请填写管理员 Token");
          return;
        }
        save();
        if (socket) socket.disconnect();

        socket = io({
          path: socketPath(),
          auth: { token, deviceId: "admin-console", role: "admin" },
          transports: ["websocket"],
          upgrade: false,
          reconnection: true,
          reconnectionDelay: 400,
          reconnectionDelayMax: 2500,
        });

        socket.on("connect", () => {
          setConnected(true);
          log("connected " + socket.id);
          socket.emit("join", { role: "admin" }, (ack) => {
            log("admin join " + JSON.stringify(ack));
            if (ack?.online) {
              $("online").textContent = (ack.online || [])
                .map((u) => `${u.userId} · ${u.deviceCount} 台`)
                .join("\n") || "当前无在线接收端";
            } else {
              refreshOnline();
            }
          });
        });
        socket.on("disconnect", (r) => {
          setConnected(false);
          log("disconnect " + r);
        });
        socket.on("connect_error", (err) => {
          setConnected(false);
          log("connect_error " + err.message + "（检查是否为 ADMIN_TOKEN）");
        });
        socket.on("presence", (p) => {
          $("online").textContent = (p.items || [])
            .map((u) => `${u.userId} · ${u.deviceCount} 台在线`)
            .join("\n") || "当前无在线接收端";
        });
        socket.on("play_sent", (p) => {
          log(`play_sent user=${p.userId} receivers=${p.receivers} id=${p.commandId}`);
        });
      }

      $("btnConnect").onclick = connect;
      $("btnRefresh").onclick = refreshOnline;

      $("btnPlay").onclick = () => {
        if (!socket?.connected) return;
        const userId = $("userId").value.trim();
        const audioUrl = $("audioUrl").value.trim();
        if (!userId || !audioUrl) {
          alert("请填写目标用户 ID 与音频 URL");
          return;
        }
        save();
        const t0 = performance.now();
        socket.emit(
          "play",
          {
            userId,
            audioUrl,
            title: $("title").value.trim() || "管理员推送",
          },
          (ack) => {
            const ms = Math.round(performance.now() - t0);
            log(`play RTT ${ms}ms · ${JSON.stringify(ack)}`);
            if (ack && ack.receivers === 0) {
              log("警告：该用户当前无在线接收端");
            }
          }
        );
      };

      $("btnStop").onclick = () => {
        if (!socket?.connected) return;
        const userId = $("userId").value.trim();
        if (!userId) return alert("请填写目标用户 ID");
        socket.emit("stop", { userId }, (ack) => log("stop " + JSON.stringify(ack)));
      };

      load();
      setConnected(false);
    </script>
  </body>
</html>
