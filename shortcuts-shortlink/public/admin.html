<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>短链接音频控制系统 - 管理后台</title>
  <style>
    :root {
      --bg: #f0f3f7;
      --card: #ffffff;
      --text: #1a1d26;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #059669;
      --danger: #dc2626;
      --warn-bg: #ecfdf5;
      --warn-border: #a7f3d0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      text-align: center;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .hidden { display: none !important; }

    /* 登录 */
    .login-box {
      max-width: 340px;
      margin: 80px auto;
      text-align: center;
    }

    .login-box input {
      width: 100%;
      margin: 8px 0;
    }

    input, button, textarea {
      font: inherit;
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="url"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    input:focus {
      outline: 2px solid rgba(37, 99, 235, 0.25);
      border-color: var(--primary);
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-block { width: 100%; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #047857; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #b91c1c; }
    .btn-secondary { background: #6b7280; }
    .btn-secondary:hover { background: #4b5563; }
    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    .btn-outline:hover { background: #eff6ff; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
      background: #fafbfc;
    }

    .section.tip {
      background: var(--warn-bg);
      border-color: var(--warn-border);
    }

    .short-link {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #fff;
      border: 1px solid var(--line);
      padding: 10px 12px;
      border-radius: 8px;
      word-break: break-all;
      margin: 8px 0;
      font-size: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.2fr auto 1.6fr 0.7fr auto;
      gap: 10px;
      align-items: center;
    }

    .id-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #fff;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f8fafc;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-remaining { background: #dbeafe; color: #1d4ed8; }
    .badge-used { background: #d1fae5; color: #047857; }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      word-break: break-all;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .muted { color: var(--muted); font-size: 12px; }
    .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
    .msg { color: var(--success); font-size: 13px; margin-top: 8px; }

    /* 简易弹层 */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .modal h3 { margin: 0 0 12px; font-size: 17px; }
    .modal .row { margin: 12px 0; }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    @media (max-width: 800px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      body { padding: 10px; }
      .container { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 登录 -->
    <div id="loginView" class="login-box">
      <h1>管理员登录</h1>
      <p class="subtitle">短链接音频控制系统</p>
      <input id="loginUsername" type="text" placeholder="账号" autocomplete="username" value="admin">
      <input id="loginPassword" type="password" placeholder="密码" autocomplete="current-password">
      <button class="btn-block" id="loginBtn" style="margin-top:12px">登录</button>
      <div id="loginError" class="error hidden"></div>
    </div>

    <!-- 主界面 -->
    <div id="mainView" class="hidden">
      <div class="topbar">
        <div>
          <h1 style="text-align:left;margin:0">短链接音频控制系统</h1>
          <div class="muted">用户专属短链接 · 按次计费</div>
        </div>
        <button class="btn-secondary btn-sm" id="logoutBtn">退出登录</button>
      </div>

      <div class="section tip">
        <h2>短链接说明</h2>
        <p class="muted" style="margin:0 0 6px">用户在苹果快捷指令中填写固定专属链接：</p>
        <div class="short-link">https://cq.imim.chat/apl/gt/{userId}</div>
        <p class="muted" style="margin:0">每次成功播放扣除 1 次；次数不足时返回「次数不足」。</p>
      </div>

      <div class="section">
        <h2>添加新用户</h2>
        <div class="form-grid">
          <div class="id-group">
            <input id="newUserId" type="text" placeholder="用户ID（2-8位字母数字）" maxlength="8">
            <button type="button" class="btn-outline btn-sm" id="randomIdBtn">随机生成</button>
          </div>
          <span class="muted" style="display:none"></span>
          <input id="newAudioUrl" type="url" placeholder="音频URL（https://...）">
          <input id="newRemaining" type="number" min="0" step="1" placeholder="初始次数" value="10">
          <button type="button" id="addUserBtn">添加</button>
        </div>
        <div id="addMsg" class="msg hidden"></div>
        <div id="addError" class="error hidden"></div>
      </div>

      <div class="section" style="background:#fff;padding:0;overflow:hidden">
        <div style="padding:16px 16px 0">
          <h2>用户列表 <span class="muted" id="userCount"></span></h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>用户ID</th>
                <th>剩余次数</th>
                <th>已使用次数</th>
                <th>当前音频URL</th>
                <th>最后访问时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <tr><td colspan="6" class="muted">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 修改音频弹窗 -->
  <div id="audioModal" class="modal-mask hidden">
    <div class="modal">
      <h3>修改音频</h3>
      <div class="row muted">用户ID：<strong id="audioModalUserId"></strong></div>
      <div class="row">
        <input id="audioModalUrl" type="url" placeholder="新的音频URL">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" id="audioModalCancel">取消</button>
        <button type="button" id="audioModalSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 充值弹窗 -->
  <div id="rechargeModal" class="modal-mask hidden">
    <div class="modal">
      <h3>充值次数</h3>
      <div class="row muted">用户ID：<strong id="rechargeModalUserId"></strong></div>
      <div class="row">
        <input id="rechargeTimes" type="number" min="1" step="1" value="10" placeholder="增加次数">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" id="rechargeModalCancel">取消</button>
        <button class="btn-success" type="button" id="rechargeModalSave">确认充值</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const SHORT_LINK_BASE = 'https://cq.imim.chat/apl/gt/';
      const USER_ID_REGEXP = /^[a-zA-Z0-9]{2,8}$/;

      const el = {
        loginView: document.getElementById('loginView'),
        mainView: document.getElementById('mainView'),
        loginUsername: document.getElementById('loginUsername'),
        loginPassword: document.getElementById('loginPassword'),
        loginBtn: document.getElementById('loginBtn'),
        loginError: document.getElementById('loginError'),
        logoutBtn: document.getElementById('logoutBtn'),
        newUserId: document.getElementById('newUserId'),
        newAudioUrl: document.getElementById('newAudioUrl'),
        newRemaining: document.getElementById('newRemaining'),
        randomIdBtn: document.getElementById('randomIdBtn'),
        addUserBtn: document.getElementById('addUserBtn'),
        addMsg: document.getElementById('addMsg'),
        addError: document.getElementById('addError'),
        userTableBody: document.getElementById('userTableBody'),
        userCount: document.getElementById('userCount'),
        audioModal: document.getElementById('audioModal'),
        audioModalUserId: document.getElementById('audioModalUserId'),
        audioModalUrl: document.getElementById('audioModalUrl'),
        audioModalCancel: document.getElementById('audioModalCancel'),
        audioModalSave: document.getElementById('audioModalSave'),
        rechargeModal: document.getElementById('rechargeModal'),
        rechargeModalUserId: document.getElementById('rechargeModalUserId'),
        rechargeTimes: document.getElementById('rechargeTimes'),
        rechargeModalCancel: document.getElementById('rechargeModalCancel'),
        rechargeModalSave: document.getElementById('rechargeModalSave')
      };

      let users = [];

      function show(node) { node.classList.remove('hidden'); }
      function hide(node) { node.classList.add('hidden'); }

      function setText(node, text, isError) {
        node.textContent = text || '';
        if (text) show(node); else hide(node);
        if (typeof isError === 'boolean') {
          // no-op placeholder for clarity
        }
      }

      function formatDate(iso) {
        if (!iso) return '从未访问';
        try {
          return new Date(iso).toLocaleString('zh-CN', { hour12: false });
        } catch (e) {
          return iso;
        }
      }

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      async function api(url, options) {
        const res = await fetch(url, {
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
          ...options
        });
        let data = null;
        const text = await res.text();
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = { message: text }; }
        return { ok: res.ok, status: res.status, data };
      }

      function showLogin() {
        show(el.loginView);
        hide(el.mainView);
      }

      function showMain() {
        hide(el.loginView);
        show(el.mainView);
      }

      async function checkSession() {
        const { ok } = await api('/api/users');
        if (ok) {
          showMain();
          await loadUsers();
        } else {
          showLogin();
        }
      }

      async function login() {
        setText(el.loginError, '');
        const username = el.loginUsername.value.trim();
        const password = el.loginPassword.value;
        const { ok, data } = await api('/api/login', {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });
        if (!ok) {
          setText(el.loginError, (data && data.message) || '登录失败');
          return;
        }
        showMain();
        await loadUsers();
      }

      async function logout() {
        await api('/api/logout', { method: 'POST', body: '{}' });
        showLogin();
      }

      async function loadUsers() {
        const { ok, data, status } = await api('/api/users');
        if (!ok) {
          if (status === 403) showLogin();
          el.userTableBody.innerHTML = '<tr><td colspan="6" class="error">加载失败</td></tr>';
          return;
        }
        users = Array.isArray(data) ? data : [];
        renderUsers();
      }

      function renderUsers() {
        el.userCount.textContent = '（共 ' + users.length + ' 人）';
        if (!users.length) {
          el.userTableBody.innerHTML = '<tr><td colspan="6" class="muted">暂无用户，请先添加</td></tr>';
          return;
        }

        el.userTableBody.innerHTML = users.map(function (u) {
          const link = SHORT_LINK_BASE + encodeURIComponent(u.userId);
          return (
            '<tr>' +
              '<td><strong>' + escapeHtml(u.userId) + '</strong><div class="muted mono">' + escapeHtml(link) + '</div></td>' +
              '<td><span class="badge badge-remaining">' + escapeHtml(u.remainingTimes) + '</span></td>' +
              '<td><span class="badge badge-used">' + escapeHtml(u.usedTimes || 0) + '</span></td>' +
              '<td class="mono">' + escapeHtml(u.audioUrl || '') + '</td>' +
              '<td class="muted">' + escapeHtml(formatDate(u.lastAccessTime)) + '</td>' +
              '<td><div class="actions">' +
                '<button class="btn-sm btn-outline" data-action="copy" data-id="' + escapeHtml(u.userId) + '">复制链接</button>' +
                '<button class="btn-sm" data-action="audio" data-id="' + escapeHtml(u.userId) + '">改音频</button>' +
                '<button class="btn-sm btn-success" data-action="recharge" data-id="' + escapeHtml(u.userId) + '">充次</button>' +
                '<button class="btn-sm btn-danger" data-action="delete" data-id="' + escapeHtml(u.userId) + '">删除</button>' +
              '</div></td>' +
            '</tr>'
          );
        }).join('');
      }

      async function generateRandomId() {
        setText(el.addError, '');
        const { ok, data } = await api('/api/users/random-id');
        if (ok && data && data.userId) {
          el.newUserId.value = data.userId;
          return;
        }
        // 前端兜底：本地生成 2–8 位
        const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const len = 2 + Math.floor(Math.random() * 7);
        let id = '';
        for (let i = 0; i < len; i++) id += chars.charAt(Math.floor(Math.random() * chars.length));
        el.newUserId.value = id;
      }

      async function addUser() {
        setText(el.addMsg, '');
        setText(el.addError, '');

        const userId = el.newUserId.value.trim();
        const audioUrl = el.newAudioUrl.value.trim();
        const remainingTimes = el.newRemaining.value;

        if (!USER_ID_REGEXP.test(userId)) {
          setText(el.addError, '用户ID需为2-8位字母或数字（a-z、A-Z、0-9）');
          return;
        }
        if (!audioUrl) {
          setText(el.addError, '请填写音频URL');
          return;
        }

        const { ok, data } = await api('/api/users', {
          method: 'POST',
          body: JSON.stringify({ userId, audioUrl, remainingTimes })
        });

        if (!ok) {
          setText(el.addError, (data && data.message) || '添加失败');
          return;
        }

        el.newUserId.value = '';
        el.newAudioUrl.value = '';
        el.newRemaining.value = '10';
        setText(el.addMsg, '添加成功');
        await loadUsers();
      }

      function openAudioModal(userId) {
        const user = users.find(function (u) { return u.userId === userId; });
        if (!user) return;
        el.audioModalUserId.textContent = user.userId;
        el.audioModalUrl.value = user.audioUrl || '';
        show(el.audioModal);
      }

      async function saveAudio() {
        const userId = el.audioModalUserId.textContent;
        const audioUrl = el.audioModalUrl.value.trim();
        if (!audioUrl) {
          alert('请填写音频URL');
          return;
        }
        const { ok, data } = await api('/api/users/' + encodeURIComponent(userId) + '/audio', {
          method: 'PUT',
          body: JSON.stringify({ audioUrl })
        });
        if (!ok) {
          alert((data && data.message) || '修改失败');
          return;
        }
        hide(el.audioModal);
        await loadUsers();
      }

      function openRechargeModal(userId) {
        el.rechargeModalUserId.textContent = userId;
        el.rechargeTimes.value = '10';
        show(el.rechargeModal);
      }

      async function saveRecharge() {
        const userId = el.rechargeModalUserId.textContent;
        const times = parseInt(el.rechargeTimes.value, 10);
        if (!Number.isFinite(times) || times <= 0) {
          alert('充值次数必须为正整数');
          return;
        }
        const { ok, data } = await api('/api/users/' + encodeURIComponent(userId) + '/recharge', {
          method: 'POST',
          body: JSON.stringify({ times })
        });
        if (!ok) {
          alert((data && data.message) || '充值失败');
          return;
        }
        hide(el.rechargeModal);
        await loadUsers();
      }

      async function deleteUser(userId) {
        if (!confirm('确定删除用户「' + userId + '」？此操作不可恢复。')) return;
        const { ok, data } = await api('/api/users/' + encodeURIComponent(userId), { method: 'DELETE' });
        if (!ok) {
          alert((data && data.message) || '删除失败');
          return;
        }
        await loadUsers();
      }

      function copyLink(userId) {
        const link = SHORT_LINK_BASE + userId;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(function () {
            alert('已复制：' + link);
          }).catch(function () {
            prompt('请手动复制：', link);
          });
        } else {
          prompt('请手动复制：', link);
        }
      }

      // 事件绑定
      el.loginBtn.addEventListener('click', login);
      el.loginPassword.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') login();
      });
      el.logoutBtn.addEventListener('click', logout);
      el.randomIdBtn.addEventListener('click', generateRandomId);
      el.addUserBtn.addEventListener('click', addUser);

      el.audioModalCancel.addEventListener('click', function () { hide(el.audioModal); });
      el.audioModalSave.addEventListener('click', saveAudio);
      el.rechargeModalCancel.addEventListener('click', function () { hide(el.rechargeModal); });
      el.rechargeModalSave.addEventListener('click', saveRecharge);

      el.userTableBody.addEventListener('click', function (e) {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');
        const id = btn.getAttribute('data-id');
        if (action === 'copy') copyLink(id);
        if (action === 'audio') openAudioModal(id);
        if (action === 'recharge') openRechargeModal(id);
        if (action === 'delete') deleteUser(id);
      });

      // 点击遮罩关闭弹窗
      el.audioModal.addEventListener('click', function (e) {
        if (e.target === el.audioModal) hide(el.audioModal);
      });
      el.rechargeModal.addEventListener('click', function (e) {
        if (e.target === el.rechargeModal) hide(el.rechargeModal);
      });

      checkSession();
    })();
  </script>
</body>
</html>
